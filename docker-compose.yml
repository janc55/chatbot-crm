version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/chatbot_unior?schema=public
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - WHATSAPP_SESSION_PATH=/app/wa_sessions
    volumes:
      - ./wa_sessions:/app/wa_sessions
    depends_on:
      - db
    restart: always

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: chatbot_unior
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
